[project]
name = "photo-sorter"
version = "0.2.0"
description = "Sort research photos into category folders (Google Drive or local) with image embeddings; learns from _training_data folders"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Galguera" }]
dependencies = [
    "pydantic>=2",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
siglip = ["torch>=2.4", "transformers>=4.50", "safetensors>=0.4"]
vertex = ["google-cloud-aiplatform>=1.70"]
drive = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]
heic = ["pillow-heif>=0.18"]
claude = ["anthropic>=0.80"]
gemini = ["google-genai>=1.0"]
photos = ["photoscript>=0.3"]
researcher = ["photo-sorter[siglip,drive,web,heic]"]
cloud = ["photo-sorter[vertex,drive,web,heic]"]
dev = ["pytest>=8", "httpx>=0.27", "photo-sorter[researcher,vertex,claude]"]

[project.scripts]
photo-sorter = "photo_sorter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photo_sorter"]

[tool.uv]
# rebuild the package whenever its code or templates change (uv otherwise reuses a cached build of the same version)
cache-keys = [{ file = "pyproject.toml" }, { file = "photo_sorter/**/*.py" }, { file = "photo_sorter/**/*.html" }, { file = "photo_sorter/**/*.svg" }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
